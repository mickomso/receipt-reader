[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "receipt-reader-backend"
version = "0.1.0"
description = "Receipt Reader MVP - Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "langchain>=0.2.6",
    "langchain-core>=0.2.10",
    "langchain-google-genai>=1.0.7",
    "langchain-openai>=0.1.0",
    "langgraph>=0.2.0",
    "python-multipart>=0.0.9",
    "pillow>=10.3.0",
    "aiofiles>=23.2.1",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.9",
    "mypy>=1.10.0",
    "types-aiofiles>=23.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
